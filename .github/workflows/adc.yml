name: STM32F103 ADC path experiment

on:
  pull_request:
    paths:
      - '.gitattributes'
      - 'tests/experiments/adc/**'
      - 'tests/experiments/renode-client/**'
      - 'tests/experiments/renode-stm32/ci-toolchain.json'
      - 'tools/backend-baseline.json'
      - 'tools/check_backend_assets.py'
      - '.github/workflows/adc.yml'
  push:
    branches: [main]
    paths:
      - '.gitattributes'
      - 'tests/experiments/adc/**'
      - 'tests/experiments/renode-client/**'
      - 'tests/experiments/renode-stm32/ci-toolchain.json'
      - 'tools/backend-baseline.json'
      - 'tools/check_backend_assets.py'
      - '.github/workflows/adc.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experiment:
    name: E-04 (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify pinned packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build/deps/downloads,build/deps/toolchain | Out-Null
          $backend = Get-Content tools/backend-baseline.json -Raw | ConvertFrom-Json
          $renode = $backend.archives | Where-Object { $_.path.StartsWith('downloads/renode-') }
          curl.exe --fail --location --silent --show-error --continue-at - --retry 2 --retry-delay 2 --retry-all-errors --max-time 300 $renode.url --output (Join-Path build/deps $renode.path)
          if ($LASTEXITCODE -ne 0) { throw 'Renode download failed' }
          $compiler = Get-Content tests/experiments/renode-stm32/ci-toolchain.json -Raw | ConvertFrom-Json
          $compilerArchive = Join-Path build/deps/downloads $compiler.archive
          curl.exe --fail --location --silent --show-error --max-time 300 $compiler.url --output $compilerArchive
          if ($LASTEXITCODE -ne 0) { throw 'Compiler download failed' }
          if ((Get-FileHash -Algorithm SHA256 $compilerArchive).Hash.ToLowerInvariant() -ne $compiler.sha256) { throw 'Compiler archive verification failed' }
          python tools/check_backend_assets.py --renode-only --archives-only
      - name: Extract verified packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          & $sevenZip x build/deps/downloads/renode-1.16.1.windows-portable-dotnet.zip '-obuild/deps/renode' -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Renode extraction failed' }
          $compiler = Get-Content tests/experiments/renode-stm32/ci-toolchain.json -Raw | ConvertFrom-Json
          & $sevenZip x (Join-Path build/deps/downloads $compiler.archive) '-obuild/deps/toolchain' -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Compiler extraction failed' }
          python tools/check_backend_assets.py --renode-only
      - name: Verify audit sources and build owned firmware
        shell: pwsh
        run: |
          python tests/experiments/renode-client/prepare.py --download
          python tests/experiments/adc/audit.py --download
          $compilers = @(Get-ChildItem build/deps/toolchain -Filter arm-none-eabi-gcc.exe -File -Recurse)
          if ($compilers.Count -ne 1) { throw "Expected one extracted compiler, found $($compilers.Count)" }
          python tests/experiments/adc/build_firmware.py --toolchain $compilers[0].Directory.FullName
      - name: Build the native ADC verifier
        shell: pwsh
        run: |
          $prepared = (Resolve-Path build/sn019/generated).Path
          $firmware = (Resolve-Path build/sn015/firmware).Path
          cmake -S tests/experiments/adc -B build/sn015/native -A x64 "-DPREPARED_ROOT=$prepared" "-DFIRMWARE_ROOT=$firmware"
          if ($LASTEXITCODE -ne 0) { throw 'Configuration failed' }
          cmake --build build/sn015/native --config Debug --target e04_probe
      - name: Run the complete predeclared E-04 profile
        run: python tests/experiments/adc/run.py --output build/sn015/results
      - name: Record compact results
        if: always()
        shell: pwsh
        run: |
          if (Test-Path build/sn015/results/summary.json) {
            python tests/experiments/adc/summarize.py build/sn015/results/summary.json build/sn015/compact.json
            Get-Content build/sn015/compact.json
          }
